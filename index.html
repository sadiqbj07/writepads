
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#1769FF">
  <meta name="description" content="WritePad Mobile — a simple, modern writing and note-taking app.">

  <title>WritePad Mobile</title>

  <!-- Progressive Web App manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- App icons -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <!-- App styles -->
  <link rel="stylesheet" href="./style.css">

  <!-- Android and mobile browser settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WritePad">
</head>

<body>
  <header class="app-header">
    <div class="app-brand">
      <img
        src="./icons/icon-192.png"
        alt="WritePad icon"
        class="app-icon"
        width="40"
        height="40"
      >

      <div class="app-brand-text">
        <h1>WritePad</h1>
        <p>Write your ideas anywhere</p>
      </div>
    </div>
  </header>

  <!-- Main app interface -->
  <main id="app">
    <noscript>
      WritePad requires JavaScript to be enabled.
    </noscript>

    <!-- Keep your existing editor interface here if it was
         previously defined in index.html. -->
  </main>

  <!-- App functionality -->
  <script src="./script.js"></script>

  <!-- Register the service worker when served from a supported origin -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(function (error) {
            console.warn("Service worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
